<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 200" width="780" height="200">
  <!-- Background -->
  <rect width="780" height="200" fill="#0a1628"/>

  <!-- ===== ICON SECTION ===== -->
  <!-- Building skyline in gold (left cluster) -->
  <rect x="52" y="58" width="12" height="80" fill="#c4952d"/>
  <rect x="48" y="70" width="4" height="68" fill="#c4952d"/>
  <rect x="64" y="68" width="4" height="70" fill="#9a7520"/>

  <!-- Tall centre building gold -->
  <rect x="68" y="42" width="14" height="96" fill="#c4952d"/>
  <rect x="68" y="42" width="14" height="96" fill="url(#goldGrad)"/>

  <!-- Right buildings white/silver -->
  <rect x="84" y="62" width="10" height="76" fill="white" opacity="0.9"/>
  <rect x="96" y="72" width="8" height="66" fill="white" opacity="0.7"/>
  <rect x="106" y="80" width="6" height="58" fill="white" opacity="0.6"/>

  <!-- Window details on gold building -->
  <rect x="71" y="50" width="3" height="4" fill="#0a1628" opacity="0.5"/>
  <rect x="77" y="50" width="3" height="4" fill="#0a1628" opacity="0.5"/>
  <rect x="71" y="60" width="3" height="4" fill="#0a1628" opacity="0.5"/>
  <rect x="77" y="60" width="3" height="4" fill="#0a1628" opacity="0.5"/>
  <rect x="71" y="70" width="3" height="4" fill="#0a1628" opacity="0.5"/>
  <rect x="77" y="70" width="3" height="4" fill="#0a1628" opacity="0.5"/>

  <!-- Roofline / house shape beneath buildings -->
  <polyline points="38,138 80,105 122,138" fill="none" stroke="white" stroke-width="4" stroke-linejoin="round"/>
  <!-- House window -->
  <rect x="74" y="118" width="12" height="9" fill="#c4952d"/>

  <!-- Base line -->
  <line x1="30" y1="140" x2="130" y2="140" stroke="white" stroke-width="2.5"/>

  <!-- G letterform (large, behind/overlapping) -->
  <text x="22" y="152" font-family="Georgia, serif" font-size="92" font-weight="700" fill="white" opacity="0.18">G</text>
  <!-- G letterform foreground (partial arc) -->
  <text x="22" y="152" font-family="Georgia, serif" font-size="92" font-weight="700" fill="none" stroke="white" stroke-width="2" opacity="0.55">G</text>

  <!-- Vertical divider -->
  <line x1="148" y1="30" x2="148" y2="170" stroke="#c4952d" stroke-width="1.5" opacity="0.7"/>

  <!-- ===== TEXT SECTION ===== -->
  <!-- GREENWAY -->
  <text x="168" y="95" font-family="Arial Black, Arial, sans-serif" font-size="52" font-weight="900" fill="white" letter-spacing="3">GREENWAY</text>

  <!-- PROPERTY MANAGEMENT in gold -->
  <text x="172" y="120" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#c4952d" letter-spacing="4">PROPERTY MANAGEMENT</text>

  <!-- Divider line under PM -->
  <line x1="172" y1="128" x2="720" y2="128" stroke="#c4952d" stroke-width="0.8" opacity="0.5"/>

  <!-- Complete property maintenance -->
  <text x="172" y="148" font-family="Arial, sans-serif" font-size="13.5" font-weight="400" fill="white" letter-spacing="1.5" opacity="0.9">COMPLETE PROPERTY MAINTENANCE &amp; REPAIR SOLUTIONS</text>

  <!-- Bottom tagline -->
  <text x="172" y="168" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="white" opacity="0.65" letter-spacing="1">ONE CALL.   |   EVERY TRADE.   |   EVERY JOB.</text>

  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4952d"/>
      <stop offset="50%" stop-color="#e8c060"/>
      <stop offset="100%" stop-color="#c4952d"/>
    </linearGradient>
  </defs>
</svg>
